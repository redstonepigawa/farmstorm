// 客户端 quickPlay：把参数追加进 MDG 生成的 argfile（--args 会被 devlaunch 当主类，用不了）
gradle.projectsEvaluated {
    def runClient = rootProject.tasks.findByName("runClient")
    runClient.doFirst {
        def port = System.getenv("FS_QUICKPLAY_PORT") ?: "25608"
        def argFile = new File(rootProject.projectDir, "build/moddev/clientRunProgramArgs.txt")
        def text = argFile.getText("UTF-8")
        if (!text.contains("--quickPlayMultiplayer")) {
            argFile.setText(text + "\n# quickplay\n--quickPlayMultiplayer\n127.0.0.1:" + port + "\n", "UTF-8")
        }
        println "[quickplay-init] port=" + port + " tail=" + argFile.getText("UTF-8").readLines().findAll { it.trim() }.takeRight(3)
    }
}
