# Farmstorm 1.20.1 probe (NeoForge 47 / NG7 userdev)
minecraft_version=1.20.1
neo_version=1.20.1-47.1.106
mod_id=probe1201
mod_version=0.0.1

# NeoForm decompile needs the java.base patch on the Gradle daemon JVM.
# Keep it in jvmargs, NOT in JDK_JAVA_OPTIONS: the env var leaks into the
# JDK-17 toolchain probe (java -version) and makes the 1.20.1 JDK look invalid.
org.gradle.jvmargs=-Xmx2G --patch-module java.base=D:/project_farm/.tools/jdk-patch/classes
org.gradle.parallel=false

org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=D:/project_farm/.tools/jdk21,C:/Users/DASHpig/AppData/Roaming/.minecraft/runtime/java-runtime-beta
