# --- 平台 / Platform ---
minecraft_version=1.20.1
neo_version=1.20.1-47.1.106
neo_version_range=[47,)
loader_version_range=[47,)

# --- 模组 / Mod ---
mod_id=farmstorm
mod_name=Farmstorm
mod_license=All Rights Reserved
mod_version=0.2.4
mod_group_id=com.dashpig.farmstorm
mod_authors=dashpig
mod_description=Vanilla crops turned into PvP gadgets.

# --- 构建 / Build ---
# NeoForm 用虚拟线程并发写同一个 ZipFS，核多时易触发写冲突：限制并发度。
org.gradle.jvmargs=-Xmx3G -XX:ActiveProcessorCount=2 --patch-module java.base=D:/project_farm/.tools/jdk-patch/classes
org.gradle.parallel=false
org.gradle.caching=true
# Gradle/NeoForm 跑在 JDK 21，javac 用 17 的 toolchain。路径必须逗号分隔。
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=D:/project_farm/.tools/jdk21,C:/Users/DASHpig/AppData/Roaming/.minecraft/runtime/java-runtime-beta
