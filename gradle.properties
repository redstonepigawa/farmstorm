# --- 平台 / Platform ---
minecraft_version=1.21.1
neo_version=21.1.213
neo_version_range=[21.1.0,)
loader_version_range=[4,)

# --- 模组 / Mod ---
mod_id=farmstorm
mod_name=Farmstorm
mod_license=All Rights Reserved
mod_version=0.1.1
mod_group_id=com.dashpig.farmstorm
mod_authors=dashpig
mod_description=Vanilla crops turned into PvP gadgets.

# --- 构建 / Build ---
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Java 21 toolchain 固定到本仓库自带的那份，避免宿主上多份 JDK 造成的不确定解析。
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=D:/project_farm/.tools/jdk21
