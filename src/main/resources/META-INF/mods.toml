modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# 1.20.1 的加载器规则：依赖项必须写 mandatory=true（1.20.2+ 才用 type="required"）；
# NeoForge 47 仍以 modid "forge" 注册（改名到 neoforge 发生在 1.20.2）。
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
